name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check the server URL is set
        if: ${{ vars.VITE_SERVER_URL == '' }}
        run: |
          echo "::error::Set the repository variable VITE_SERVER_URL (Settings → Secrets and variables → Actions → Variables) to your server URL, e.g. https://letter-race-server.onrender.com"
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # With a custom domain the site lives at "/"; otherwise at "/<repo-name>/".
      - name: Work out the base path
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cname=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // empty' || true)
          if [ -n "$cname" ]; then base=/; else base="/${{ github.event.repository.name }}/"; fi
          echo "Custom domain: ${cname:-none}; base path: $base"
          echo "path=$base" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter @letter-race/web build
        env:
          VITE_BASE: ${{ steps.base.outputs.path }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
